name: Update Main Account Profile SVG

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          repository: 'frostyfoxie/frostyfoxie' # Replace with main account/repo name
          token: ${{ secrets.MAIN_REPO_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Dynamic SVG
        env:
          GH_USERNAME: 'YOUR_MAIN_USERNAME' # Set explicitly to your main account username
          GITHUB_TOKEN: ${{ secrets.MAIN_REPO_PAT }}
          INSTAGRAM_HANDLE: 'your_instagram'
        run: |
          python scripts/update_svg.py

      - name: Commit and Push Changes to Main Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile.svg btn_instagram.svg btn_email.svg btn_github.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update all-time profile stats [via alt runner]" && git push)
